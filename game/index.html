<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PETIR — Guardian of the Monsoon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070d1f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="PETIR, Guardian of the Monsoon: fly the storm kite with WASD or arrow keys, aim with the mouse, fire lightning with click or Space. Survive 10 waves and defeat the Storm King."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
